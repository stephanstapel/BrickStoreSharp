name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
 
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore dependencies test
      run: dotnet restore BrickStoreSharp-Test/BrickStoreSharp-Test.csproj
    - name: Build test
      run: dotnet build BrickStoreSharp-Test/BrickStoreSharp-Test.csproj --no-restore        
    - name: Actual test
      run: dotnet test BrickStoreSharp-Test/BrickStoreSharp-Test.csproj --no-build --verbosity normal        
    - name: Restore library dependencies 
      run: dotnet restore BrickStoreSharp/BrickStoreSharp.csproj
    - name: Build library
      run: dotnet build BrickStoreSharp/BrickStoreSharp.csproj --no-restore

  # runs the netstandard2.0 build of the library on .NET Framework (net48 test target, Windows only)
  test-netframework:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Test on .NET Framework
      run: dotnet test BrickStoreSharp-Test/BrickStoreSharp-Test.csproj -f net48 --verbosity normal
